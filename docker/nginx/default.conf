# request_time = total incl. client; upstream_response_time = pure PHP-FPM time
log_format timing '$remote_addr "$request" $status req=$request_time php=$upstream_response_time';

server {
    listen 80;
    index index.php index.html;
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log timing;
    root /var/www/public;

    # Compress dynamic responses (HTML, Livewire JSON) and text assets
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # Vite output is content-hashed: safe to cache forever.
    # ^~ so this prefix beats the static-extension regex below.
    location ^~ /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Unhashed static files (vendored leaflet, uploaded media, images).
    # Fall back to Laravel: some asset URLs are routes, not files
    # (e.g. /livewire/livewire.js).
    location ~* \.(?:ico|png|jpe?g|gif|webp|svg|woff2?|ttf|css|js)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }
}
